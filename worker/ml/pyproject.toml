[project]
name = "sealedai-ml"
version = "0.1.0"
description = "ML plane of the sealed worker: safe model loader, LoRA trainer, evaluator, server"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch",
  "transformers",
  "peft",
  "safetensors",
  "numpy",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sealedai_ml"]
