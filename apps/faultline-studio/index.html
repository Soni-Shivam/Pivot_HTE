<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' __API_ORIGIN__ https: wss:; frame-src https://*.coinbase.com https://*.walletconnect.com https://*.walletconnect.org; child-src https://*.coinbase.com; media-src 'self' __API_ORIGIN__ https://raw.githubusercontent.com; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Faultline</title>
  <meta property="og:title" content="Faultline">
  <meta name="description" content="Adversarial testing for autonomous vehicles, verified on 0G.">
  <meta property="og:description" content="Adversarial testing for autonomous vehicles, verified on 0G.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a; --ink: #111111; --paper: #fbfbf6; --muted: #55554f; --line: #111111;
      --yellow: #f3f56c; --cyan: #7cecf5; --pink: #f5a3ef; --purple: #7c5cf5; --lime: #c9f36f; --hot: #ff4fc3;
      --ease: cubic-bezier(.23, 1, .32, 1);
      --sans: "Space Grotesk", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box } img { max-width: 100%; height: auto } .split > * { min-width: 0 }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }
    a { color: inherit }
    :focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; border-radius: 12px }
    .card :focus-visible { outline-color: var(--purple) } .judge :focus-visible { outline-color: var(--ink) }
    code, .mono { font-family: var(--mono); font-size: .86em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
    .hidden { display: none !important }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

    .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); white-space: nowrap; font-weight: 500; font-size: 14px; text-decoration: none }
    .pill.y { background: var(--yellow) } .pill.c { background: var(--cyan) } .pill.p { background: var(--pink) } .pill.l { background: var(--lime) } .pill.k { background: var(--ink); color: var(--paper) }
    .pill.sm { min-height: 26px; padding: 0 10px; font-size: 13px }
    .pill.big { min-height: 48px; padding: 0 22px; font-size: 22px; font-weight: 600 }
    .btn { min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: transform .16s var(--ease), background .2s var(--ease) }
    .btn:active:not(:disabled) { transform: scale(.97) }
    .btn.k { background: var(--ink); color: var(--paper) } .btn.y { background: var(--yellow) } .btn.l { background: var(--lime) }
    .btn.big { min-height: 56px; font-size: 18px; padding: 0 28px }
    .btn:disabled { opacity: .45; cursor: not-allowed }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #777; flex: none } .dot.up { background: var(--lime) } .dot.down { background: var(--hot) } .dot.part { background: var(--yellow) }

    header { display: flex; align-items: center; gap: 18px; padding: 14px 24px; position: sticky; top: 0; z-index: 10; background: var(--bg) }
    .brand { color: var(--paper); font-weight: 700; font-size: 22px; letter-spacing: -.02em; white-space: nowrap; text-decoration: none }
    .brand i { font-style: normal; color: var(--yellow) }
    nav.top { display: flex; gap: 4px; background: #1a1a1a; padding: 4px; border-radius: 999px }
    nav.top a, nav.top button { min-height: 36px; padding: 0 16px; border-radius: 999px; color: #b8b8b2; font-weight: 500; white-space: nowrap; transition: background .2s var(--ease), color .2s var(--ease) }
    nav.top a.on, nav.top button.on { background: var(--paper); color: var(--ink) }
    .runtabs { display: flex; gap: 8px; flex-wrap: wrap }
    .runtabs a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 18px; border-radius: 999px; border: 1.5px solid #fbfbf655; color: var(--paper); text-decoration: none; font-weight: 600 }
    .runtabs a.on { background: var(--paper); color: var(--ink) }
    .hdr-right { margin-left: auto; display: flex; gap: 8px; align-items: center }

    main { padding: 8px 24px 56px; max-width: 1280px; margin: 0 auto }
    .card { background: var(--paper); border-radius: 28px; padding: 28px; position: relative; border: 1.5px solid var(--line) }
    .card.c { background: var(--cyan) } .card.y { background: var(--yellow) } .card.p { background: var(--pink) } .card.l { background: var(--lime) }
    .card.k { background: #161616; color: var(--paper); border-color: #2a2a2a }
    .grid { display: grid; gap: 16px } .grid > * { min-width: 0 }
    h1, h2, h3 { letter-spacing: -.02em; margin: 0 }
    .lede { font-size: 18px; color: var(--muted); margin: 8px 0 0; max-width: 70ch }
    .card.k .lede { color: #b8b8b2 }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap }
    .head h2 { font-size: 22px; font-weight: 600 }
    .err { color: #9c005d; font-weight: 500; margin: 10px 0 0; white-space: pre-wrap }
    .err:empty { display: none }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
    video { width: 100%; display: block; border-radius: 20px; background: #000; aspect-ratio: 16 / 9; border: 1.5px solid var(--line) }
    table { width: 100%; border-collapse: collapse }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #11111120 } th { font-weight: 500; color: var(--muted); font-size: 14px }
    tbody tr:last-child td { border-bottom: 0 }
    .tscroll { overflow-x: auto }

    /* tooltips: hover or keyboard/tap focus */
    .tip { position: relative; text-decoration: underline dotted 1.5px; text-underline-offset: 3px; cursor: help }
    [data-tip] { position: relative }
    [data-tip]:hover::after, [data-tip]:focus-visible::after, [data-tip]:focus::after {
      content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 8px); z-index: 30; width: max-content; max-width: min(300px, 80vw);
      padding: 10px 12px; border-radius: 14px; background: var(--ink); color: var(--paper); font: 500 13px/1.4 var(--sans); white-space: normal; text-align: left; pointer-events: none }

    /* hero */
    .hero { position: relative; overflow: hidden; min-height: 460px; display: flex; align-items: center; padding: 48px }
    .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .75 }
    .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #161616 0%, #161616e0 38%, #16161600 75%); pointer-events: none }
    .hero-text { position: relative; z-index: 1; max-width: 560px }
    .hero h1 { font-size: clamp(28px, 3vw, 40px); line-height: 1.15; font-weight: 600; color: var(--paper) }
    .lidar-label { position: absolute; right: 20px; bottom: 16px; z-index: 1; font: 12px var(--mono); color: #b8b8b2 }
    .fact { color: var(--yellow); font-weight: 600; margin: 12px 0 0 }
    .replay canvas { width: 100%; height: 340px; display: block; border-radius: 20px; border: 1.5px solid var(--line) }
    #ex-feed { max-height: 340px }
    .arch { display: grid; gap: 6px; margin-top: 18px }
    .arow { display: grid; grid-template-columns: minmax(0,1fr) 130px minmax(0,1fr) 130px minmax(0,1fr); gap: 0; align-items: center }
    .arow.four { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px } .arow.two { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; width: 60%; margin: 0 auto }
    .ab { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; background: var(--paper); display: flex; flex-direction: column; gap: 2px; min-width: 0; transition: transform .2s var(--ease) }
    .ab:hover { transform: translateY(-2px) }
    .ab.l { background: var(--lime) } .ab.p { background: var(--pink) } .ab.c { background: #e6fbfd } .ab.y { background: #fbfcd0 }
    .ab b { font-size: 15px; font-weight: 600 } .ab span { font-size: 13px; color: #444; overflow-wrap: anywhere }
    .ar { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 6px }
    .ar span, .adown span { font: 11px var(--mono); color: var(--muted); text-align: center; line-height: 1.3 }
    .ar i { position: relative; display: block; width: 100%; height: 1.5px; background: var(--ink) }
    .ar i::before, .ar i::after { content: ''; position: absolute; top: -3.25px; border: 4px solid transparent }
    .ar i::after { right: -1px; border-left: 6px solid var(--ink); border-right: 0 } .ar i::before { left: -1px; border-right: 6px solid var(--ink); border-left: 0 }
    .adown { display: flex; align-items: center; gap: 8px; justify-content: center; height: 34px }
    .adown i { position: relative; width: 1.5px; height: 100%; background: var(--ink) }
    .adown i::after { content: ''; position: absolute; bottom: -1px; left: -3.25px; border: 4px solid transparent; border-top: 6px solid var(--ink); border-bottom: 0 }
    .sec { font-size: clamp(24px, 2.6vw, 34px); font-weight: 600; margin-bottom: 12px }
    .kicker { font: 13px var(--mono); margin: 0 0 8px; color: var(--muted) } .card.k .kicker { color: #9a9a94 }
    .two-col { display: grid; grid-template-columns: 1fr 1.4fr; gap: 28px; align-items: start } .big-copy { font-size: 19px; margin: 0 }
    .roles { list-style: none; padding: 0; margin: 16px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 20px }
    .roles li { display: flex; gap: 8px; align-items: center; font-size: 15px } .roles i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--ink); flex: none }
    .moments { list-style: none; padding: 0; margin: 20px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px }
    .moments img, .still img { width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 14px; border: 1px solid var(--line); transition: transform .3s var(--ease) }
    .still img.contain { object-fit: contain; background: var(--paper) }
    .moments li { display: flex; flex-direction: column; gap: 4px } .moments b { font: 600 13px var(--mono); margin-top: 6px } .moments span { font-size: 14px }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-top: 18px }
    .stats div, .numbers div { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column }
    .stats b { font-size: 22px } .stats span, .numbers span { font-size: 13px; color: var(--muted) }
    .receipts { margin: 14px 0 0; font-size: 14px } .linkbtn { text-decoration: underline; font-weight: 600; padding: 0; min-height: 0 }
    .cards3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 8px }
    .cards3 div { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 4px; transition: transform .2s var(--ease) }
    .cards3 div:hover { transform: translateY(-2px) } .cards3 b { font-size: 16px } .cards3 span { font-size: 14px; color: #333 }
    .stills { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px }
    .still { margin: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden } .still:hover img { transform: scale(1.02) }
    .still figcaption { display: flex; flex-direction: column; gap: 2px } .still b { font-size: 16px } .still span { font-size: 14px; color: var(--muted) }
    .numbers { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px }
    .numbers div { background: #161616; border-color: #2a2a2a; color: var(--paper); padding: 20px } .numbers b { font-size: 34px; font-weight: 700; color: var(--yellow) } .numbers span { color: #b8b8b2 }
    .why { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 16px }
    .why div { background: #1f1f1f; border: 1.5px solid #333; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px; transition: transform .2s var(--ease) }
    .why div:hover { transform: translateY(-2px) }
    .why b { color: var(--yellow); font-size: 17px } .why span { color: #d0d0ca; font-size: 14px }
    .sub1 { color: var(--paper); font-weight: 600; margin: 10px 0 0 }
    #rscene.mini { height: 140px !important; margin-top: 12px }
    .steps5 { margin: 0; padding-left: 22px; display: grid; gap: 10px } .steps5 li { font-size: 16px }
    .codebox { position: relative; min-width: 0 } .codebox .copy { position: absolute; top: 18px; right: 10px }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px } .tabs .on { background: var(--ink); color: var(--paper) }
    .split2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.2fr); gap: 14px; align-items: start }
    .hero2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center; padding: 40px }
    .hero2 h1 { font-size: clamp(28px, 3.2vw, 44px); line-height: 1.12; font-weight: 600; color: var(--paper) }
    .hero-clip { margin: 0; position: relative } .hero-clip video { border-color: #333 }
    .hero-clip figcaption { position: absolute; left: 12px; top: 12px; font: 12px var(--mono); background: #000000b0; color: #fff; padding: 4px 8px; border-radius: 8px }
    .pitch { color: var(--paper); font-size: clamp(18px, 2vw, 24px); font-weight: 500; text-align: center; margin: 12px auto; max-width: 900px }
    .groups3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px }
    .groups3 div { background: #1f1f1f; border: 1px solid #333; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px }
    .groups3 b { color: var(--yellow); font-size: 17px } .groups3 span { color: #d0d0ca; font-size: 14px }
    a.btn { color: inherit } .card.k a.btn:not(.k) { color: var(--ink) }
    nav.top a { min-height: 36px; padding: 0 14px; border-radius: 999px; color: #b8b8b2; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; text-decoration: none }
    .mc-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap }
    .states { list-style: none; display: flex; gap: 6px; flex-wrap: wrap; padding: 0; margin: 0 }
    .states li { font: 12px var(--mono); padding: 5px 10px; border-radius: 999px; border: 1px solid #444; color: #9a9a94 }
    .states li.done { color: var(--paper); border-color: #666 } .states li.cur { background: var(--paper); color: var(--ink); border-color: var(--paper) }
    .states li.bad { background: var(--hot); color: var(--ink); border-color: var(--hot) }
    .mc-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start }
    .mc-main { padding: 16px } .mc-stage { position: relative } .mc-stage video, .mc-stage img { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 14px; background: #000; object-fit: contain; border: 0 }
    .mc-overlay { position: absolute; left: 12px; bottom: 58px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none }
    .mc-overlay span { font: 600 13px var(--mono); background: #000000c0; color: #fff; padding: 5px 9px; border-radius: 8px }
    .mc-overlay .act-on { background: var(--yellow); color: var(--ink) }
    .mc-progress { aspect-ratio: 16 / 9; background: #0d0d0d; border-radius: 14px; padding: 20px; overflow: auto; color: var(--paper) }
    .mc-progress h3 { margin: 0 0 6px } .mc-progress .eta { font: 13px var(--mono); color: #9a9a94; margin: 0 0 12px }
    .mc-progress ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px }
    .mc-progress li { border-left: 3px solid #444; padding: 4px 10px; font-size: 14px } .mc-progress li.ok { border-color: var(--lime) } .mc-progress li.run { border-color: var(--yellow) } .mc-progress li.bad { border-color: var(--hot) }
    .mc-progress small { display: block; font: 12px var(--mono); color: #9a9a94 }
    #mc-live.peek { position: absolute; right: 12px; bottom: 12px; width: 32%; aspect-ratio: 16 / 9; border: 1px solid #444 }
    .mc-note { color: #9a9a94; font-size: 13px; margin: 8px 0 0 } .mc-note:empty { display: none }
    .mc-timeline { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 2px }
    .mc-timeline button { flex: none; font: 12px var(--mono); color: var(--paper); border: 1px solid #444; border-radius: 10px; padding: 6px 9px; text-align: left; min-height: 44px }
    .mc-timeline button.on { background: var(--paper); color: var(--ink) } .mc-timeline button.halt { border-color: var(--hot) } .mc-timeline button.plan { border-color: var(--yellow) }
    .mc-insp { max-height: 640px; overflow: auto } .mc-insp dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 14px }
    .mc-insp dt { color: var(--muted) } .mc-insp dd { margin: 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere }
    .mc-insp .why-q { background: #f1f1ea; border-radius: 12px; padding: 10px 12px; margin: 12px 0 }
    .srcs { font: 12px var(--mono); color: var(--muted) }
    .vf-in { flex: 1; min-width: 220px; min-height: 48px; border-radius: 999px; border: 1px solid #444; background: #111; color: var(--paper); padding: 0 16px; font: 14px var(--mono) }
    .vtl { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px }
    .vtl li { border-top: 3px solid #ccc; padding-top: 8px } .vtl li.ok { border-color: #2f9e44 } .vtl li.na { border-color: #ccc } .vtl b { display: block } .vtl span { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere }
    .proof { border: 1px solid #ddd; border-radius: 14px; margin-top: 10px; background: #fff } .proof summary { cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap }
    .proof .body { padding: 0 14px 14px; font-size: 14px } .proof code { font-size: 12px }
    .st { font: 600 12px var(--mono); padding: 3px 8px; border-radius: 6px; border: 1px solid currentColor; white-space: nowrap }
    .st.verified { color: #24782f } .st.failed { color: #c92a2a } .st.unavailable { color: #a06200 } .st.notchecked, .st.na { color: #666 }
    .note-a2 { font-size: 14px }
    .res-head { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: center }
    .reason { padding-left: 20px; display: grid; gap: 10px } .reason li span { display: block } .reason small { display: block; font: 12px var(--mono); color: var(--muted) }
    .claims { display: grid; gap: 8px } .claim { border: 1px solid #ddd; border-radius: 14px; background: #fff } .claim summary { cursor: pointer; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap }
    .claim .body { padding: 0 14px 14px; font-size: 14px } tr.win td { background: #eefbe6 }
    .auth2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px } .auth-box { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: #fff; display: flex; flex-direction: column; gap: 4px }
    .auth-box span { font-size: 14px; color: #333 } .choice .iface { font: 12px var(--mono); color: var(--muted) }
    .judge { position: fixed; right: 16px; bottom: 16px; z-index: 60; width: min(420px, calc(100vw - 32px)); background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 10px 40px #0008 }
    .judge h3 { margin: 6px 0 6px; font-size: 20px } .judge p { margin: 0 0 12px; font-size: 15px } .jtop { display: flex; justify-content: space-between; align-items: center }
    .hl { outline: 3px solid var(--yellow) !important; outline-offset: 4px; border-radius: 14px }
    .split .stats { grid-template-columns: 1fr 1fr }
    .fam { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; margin-top: 12px } .fam.compact { margin-top: 18px }
    .fam figure { margin: 0 } .fam video { border-radius: 12px; border: 1px solid var(--line) } .fam b { display: block; font-size: 15px; margin-top: 6px } .fam small { font: 12px var(--mono); color: var(--muted) }
    .why-line { font-size: 14px; margin-top: 2px } 
    .plan b { display: block; margin-bottom: 8px } .plan ul { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 6px }
    .plan li { display: flex; gap: 8px; align-items: center; font-size: 14px } .plan li i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--ink); flex: none }
    .enables { margin: 18px 0 0; font-size: 18px; font-weight: 600 }
    .btn:hover:not(:disabled) { transform: translateY(-1px) }
    .diagram { width: 100%; max-width: 980px; height: auto; display: block; margin: 0 auto }
    .card.k .btn:not(.k) { color: var(--ink) }
    .diagram .bx rect { stroke: var(--ink); stroke-width: 2 }
    .diagram text { font: 15px var(--sans); fill: var(--ink) } .diagram text.t { font-weight: 700; font-size: 19px } .diagram text.s { font-size: 14px; fill: var(--muted) }
    .how-list { display: none; margin: 0; padding-left: 20px } .how-list li { margin: 8px 0 }
    .get { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 10px 0 0 }
    .get li { border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px; background: var(--lime); font-weight: 500 }
    /* stepper */
    .stepper { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; padding: 0; list-style: none }
    .stepper button { min-height: 40px; padding: 0 16px 0 6px; border-radius: 999px; background: #1a1a1a; color: #b8b8b2; font-weight: 500; display: inline-flex; gap: 8px; align-items: center }
    .stepper button i { font-style: normal; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #2a2a2a; font-weight: 700; font-size: 14px }
    .stepper button.on { background: var(--paper); color: var(--ink) } .stepper button.on i { background: var(--ink); color: var(--paper) }
    .stepper button.done i { background: var(--lime); color: var(--ink) }
    .stepper button:disabled { opacity: .5; cursor: not-allowed }
    .step h2 { font-size: 30px; font-weight: 700 }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px }
    .choices.three { grid-template-columns: repeat(3, 1fr) }
    .choice { text-align: left; border: 1.5px solid var(--line); border-radius: 24px; padding: 20px; background: var(--paper); transition: transform .16s var(--ease), box-shadow .16s var(--ease); display: flex; flex-direction: column; gap: 6px }
    .choice:active:not(:disabled) { transform: scale(.985) }
    .choice[aria-checked="true"] { box-shadow: 0 0 0 4px var(--ink); background: var(--lime) }
    .choice:disabled { opacity: .55; cursor: not-allowed }
    .choice b { font-size: 20px } .choice span { color: var(--muted) } .choice small { color: var(--muted); font-size: 13px }
    .note { background: #ffffff90; border: 1.5px dashed var(--line); border-radius: 18px; padding: 14px 16px; margin-top: 18px; font-size: 15px }
    .nav-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; align-items: center }
    .wallets { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px }
    .wallets img { width: 24px; height: 24px; border-radius: 6px }
    .summary { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 18px 0 0 }
    .summary dt { color: var(--muted) } .summary dd { margin: 0; font-weight: 600 }
    pre.msg { background: var(--ink); color: var(--paper); border-radius: 16px; padding: 14px; font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0 }

    /* live */
    .pit { grid-template-columns: 1fr 360px; align-items: start }
    .statusbar { display: flex; gap: 8px 20px; align-items: center; flex-wrap: wrap; padding: 16px 20px }
    .stat small { display: block; color: var(--muted); font-size: 13px } .stat b { font-family: var(--mono); font-size: 20px; font-weight: 600 }
    .live { animation: blink 1.2s steps(2) infinite } @keyframes blink { 50% { opacity: .55 } }
    .scene { padding: 0; overflow: hidden } .scene canvas { width: 100%; height: 360px; display: block } #live-cam, #replay-vid { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #000 } video.clip { margin-top: 14px }
    .feed { display: flex; flex-direction: column; gap: 8px; max-height: 560px; overflow: auto }
    .dec { background: #ffffffc0; border: 1.5px solid transparent; border-radius: 16px; padding: 10px 12px }
    .dec.new { animation: rowin .35s var(--ease); border-color: var(--line) }
    @keyframes rowin { from { opacity: 0; transform: translateY(-6px) } }
    .dec.wait { background: transparent; border: 1.5px dashed #11111170 }
    .dec .what { font-weight: 600 } .dec .meta { color: var(--muted); font-size: 13px }
    .dec details summary { cursor: pointer; font-size: 13px; color: var(--muted); margin-top: 4px }
    .dec pre { font: 11px/1.4 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; background: var(--ink); color: var(--paper); padding: 8px; border-radius: 10px }
    .progress { margin: 0; padding: 0; list-style: none }
    .progress li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 6px 0 }
    .progress .d { font-size: 13px; color: var(--muted); overflow-wrap: anywhere }
    .ic { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #11111150; margin-top: 2px }
    .ic.run { border-color: var(--ink); border-top-color: transparent; animation: spin .7s linear infinite }
    .ic.ok { background: var(--lime); border-color: var(--ink) } .ic.fail { background: var(--hot); border-color: var(--ink) }
    @keyframes spin { to { transform: rotate(360deg) } }
    .tele canvas { width: 100%; height: 150px; display: block }
    .log { font-family: var(--mono); font-size: 11px; max-height: 220px; overflow: auto; white-space: pre-wrap; margin-top: 10px }
    details.more > summary { cursor: pointer; font-weight: 600; min-height: 36px; display: flex; align-items: center }

    /* results */
    .verdict h2 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 700; line-height: 1.1 }
    .scrub { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap }
    .scrub input { flex: 1; min-width: 160px; accent-color: var(--ink); min-height: 32px }
    .rail { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
    .tp { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--paper); text-decoration: none; min-height: 72px }
    .tp .n { display: flex; gap: 8px; align-items: center; font-weight: 600 } .tp .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere }
    a.tp:hover { background: #fff }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 10px 0 0 }
    .kv dt { color: var(--muted) } .kv dd { margin: 0; text-align: right; overflow-wrap: anywhere }
    .drawer { margin-top: 14px; border-top: 1.5px solid #11111125; padding-top: 10px }

    /* explore */
    .explore-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px }
    .split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 14px }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px }
    .board .cell { border: 1.5px solid var(--line); border-radius: 18px; padding: 12px; background: var(--paper) }
    .board .cell b { display: block; font-size: 20px; font-family: var(--mono) }
    select { font: inherit; min-height: 48px; border-radius: 999px; border: 1.5px solid var(--line); padding: 0 14px; background: var(--paper) }
    #offline { margin-bottom: 16px }

    @media (max-width: 1000px) {
      .fam { grid-template-columns: 1fr 1fr }
      .res-head { grid-template-columns: 1fr }
      .hero2, .mc-grid, .groups3 { grid-template-columns: 1fr } .vtl { grid-template-columns: 1fr 1fr }
      .pit, .split { grid-template-columns: minmax(0, 1fr) } .how { grid-template-columns: 1fr 1fr } .choices.three { grid-template-columns: 1fr }
      .board { grid-template-columns: 1fr 1fr }
    }
    @media (max-width: 640px) {
      .auth2 { grid-template-columns: 1fr }
      .lidar-label { display: none } .split2 { grid-template-columns: 1fr }
      .arow, .arow.four, .arow.two { grid-template-columns: 1fr; width: 100%; gap: 0 } .arow.four .ab + .ab, .arow.two .ab + .ab { margin-top: 8px }
      .ar { flex-direction: row-reverse; justify-content: center; height: 34px; gap: 8px; padding: 0 } .ar i { width: 1.5px; height: 100%; flex: none }
      .ar i::before { left: -3.25px; top: -1px; border: 4px solid transparent; border-bottom: 6px solid var(--ink); border-top: 0 } .ar i::after { right: auto; left: -3.25px; top: auto; bottom: -1px; border: 4px solid transparent; border-top: 6px solid var(--ink); border-bottom: 0 }
      .two-col, .cards3, .stills, .roles { grid-template-columns: 1fr } .moments, .stats, .numbers { grid-template-columns: 1fr 1fr } .hero { padding: 24px; min-height: 420px } .hero::after { background: #161616c0 }
      main { padding: 8px 16px 40px } .card { padding: 20px; border-radius: 22px } .hero { padding: 22px }
      .how, .choices, .facts { grid-template-columns: 1fr } .step h2 { font-size: 24px } .scene canvas { height: 260px }
      .stepper button span { display: none } .stepper button { padding: 0 6px }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important } }
    /* rebuild: header CTA, orbs, attack catalogue, featured runs */
    .orb { display: inline-block; vertical-align: middle; flex: none }
    .hdr-right .btn { min-height: 38px; padding: 0 16px; font-size: 15px }
    #run-cta.on { box-shadow: 0 0 0 2px var(--paper) }
    .chip { display: inline-flex; align-items: center; font: 600 12px var(--mono); padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); white-space: nowrap }
    .chip.live { background: var(--lime) } .chip.dev { background: #e9e9e2; color: #3d3d38 }
    .atk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 28px; align-items: center }
    .atk figure { margin: 0; position: relative } .atk img, .atk video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 18px; border: 1.5px solid var(--line); display: block }
    .atk figure .chip { position: absolute; left: 12px; top: 12px }
    .atk h2 { font-size: 26px; font-weight: 600; margin: 8px 0 6px } .atk p { margin: 0; color: var(--muted); font-size: 17px }
    .fam figure { position: relative } .fam .chip { margin-top: 6px }
    .featured { display: grid; grid-template-columns: 1fr 1fr; gap: 16px }
    .featured .card { display: flex; flex-direction: column; gap: 10px } .featured img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 16px; border: 1px solid var(--line) }
    .mc-orb-row { display: flex; gap: 16px; align-items: center; margin-bottom: 14px } .mc-orb-row h3 { margin: 0 }
    .mc-wait { flex: none; display: inline-flex; gap: 8px; align-items: center; font: 12px var(--mono); color: var(--paper); border: 1px dashed #666; border-radius: 10px; padding: 6px 10px; min-height: 44px }
    .loading { display: flex; gap: 12px; align-items: center; color: var(--muted); padding: 8px 0 } .card.k .loading, .mc-progress .loading { color: #b8b8b2 }
    .note-start { display: flex; gap: 8px; align-items: center }
    @media (max-width: 1000px) { .atk, .featured { grid-template-columns: 1fr } }
    @media (max-width: 640px) { .atk h2 { font-size: 22px } }
    /* shell (PRD 6, 8): skip link, header status, phone menu, offline strip, judge dialog, 12/8/4 grid, 44px targets, no horizontal scroll */
    html, body { overflow-x: hidden } body { line-height: 1.45 } main { min-width: 0 }
    .skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--yellow); color: var(--ink); padding: 10px 16px; border-radius: 999px; font-weight: 600; text-decoration: none; transition: top .2s var(--ease) }
    .skip:focus { top: 12px }
    main:focus { outline: none }
    nav.top a, .hdr-right .btn, .hdr-right .pill, #menu-btn, .judge .btn, .judge .pill { min-height: 44px }
    @media (pointer: coarse) { button, .btn, .pill, a.chip, select, input { min-height: 44px } }
    #status-pill { background: #1a1a1a; color: #e4e4de; border-color: #333; min-height: 44px }
    #wallet-btn { background: transparent; color: var(--paper); border-color: #333 } /* outline: Run a test is the header's one primary */
    .hdr-right .btn, .hdr-right .pill { white-space: nowrap }
    #status-pill { min-width: 44px; justify-content: center }
    /* status text stays readable by screen readers when only the dot shows */
    @media (max-width: 1199px) { #status-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap } }
    #wallet-btn[data-tip]::after { left: auto; right: 0; max-width: min(300px, 60vw) }
    #menu-btn { display: none; color: var(--paper); border: 1.5px solid #333; border-radius: 999px; padding: 0 16px; font-weight: 600; background: #1a1a1a }
    #offline-strip { margin: 0 auto 16px; max-width: 1280px; padding: 12px 18px; border-radius: 18px; background: #161616; color: var(--paper); border: 1.5px solid #2a2a2a; display: flex; gap: 10px; align-items: center }
    .g12 { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)) } .g12 > * { min-width: 0 }
    .s12 { grid-column: span 12 } .s8 { grid-column: span 8 } .s6 { grid-column: span 6 } .s4 { grid-column: span 4 } .s3 { grid-column: span 3 }
    @media (max-width: 1023px) { .g12 { grid-template-columns: repeat(8, minmax(0, 1fr)) } .s8, .s12 { grid-column: span 8 } .s6, .s4 { grid-column: span 4 } .s3 { grid-column: span 2 } }
    @media (max-width: 767px) { .g12 { grid-template-columns: repeat(4, minmax(0, 1fr)) } .s12, .s8, .s6, .s4 { grid-column: span 4 } .s3 { grid-column: span 2 } }
    .judge { width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto }
    .judge h2 { margin: 6px 0; font-size: 20px } .judge p { margin: 0 0 12px; font-size: 15px }
    .judge .row { justify-content: space-between }
    .hl { outline: 3px solid var(--yellow) !important; outline-offset: 4px; border-radius: 14px; transition: outline-color .2s var(--ease) }
    /* tablet and phone: one row of brand, status dot, (Run a test), wallet, Menu; nav opens below */
    @media (max-width: 1023px) {
      header { flex-wrap: wrap; gap: 8px; padding: 10px 16px }
      .brand { margin-right: auto }
      #menu-btn { display: inline-flex; align-items: center; order: 3 }
      nav.top { order: 4; width: 100%; flex-direction: column; border-radius: 20px; overflow: visible }
      nav.top:not(.open) { display: none }
      nav.top a { width: 100%; font-size: 16px; padding: 0 16px }
      .hdr-right { order: 2; margin-left: 0 }
    }
    @media (max-width: 767px) {
      .hdr-right #run-cta { display: none } /* it is the first item in the menu */
      header { gap: 6px } .hdr-right { gap: 6px } .brand { font-size: 20px }
      #wallet-btn, #menu-btn { padding: 0 12px; font-size: 14px }
      main { padding: 8px 16px 40px } #offline-strip { margin: 0 16px 16px }
    }
    @media (max-width: 399px) { .brand { font-size: 18px } #wallet-btn, #menu-btn { padding: 0 10px } }
    .hdr-right { position: relative }
    .wallet-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 40; width: min(340px, calc(100vw - 32px)); background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 8px; box-shadow: 0 10px 30px #0008 }
    .wallet-pop .btn { justify-content: center } .wallet-pop img { border-radius: 5px }
    .wallet-pop p { margin: 0; font-size: 14px } .wallet-pop .wp-err { color: #9c005d; font-weight: 500 } .wallet-pop a { color: inherit; font-weight: 600 }
  </style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="hdr"></header>
<div id="offline-strip" class="hidden" role="status"><i class="dot down"></i><span>The live runner is offline. Recorded clips, the run library and the independent verifier still work.</span></div>
<main id="main" tabindex="-1">
  <section id="v-home" class="hidden" aria-label="Discover"></section>
  <section id="v-lab" class="hidden" aria-label="Run a test"></section>
  <section id="v-mission" class="hidden" aria-label="Mission"></section>
  <section id="v-results" class="hidden" aria-label="Results"></section>
  <section id="v-verify" class="hidden" aria-label="Verify"></section>
  <section id="v-library" class="hidden" aria-label="Explore runs"></section>
  <section id="v-research" class="hidden" aria-label="Research"></section>
  <section id="v-stack" class="hidden" aria-label="Your stack"></section>
</main>
<div class="judge hidden" id="judge" role="dialog" aria-modal="true" aria-labelledby="j-title">
  <div class="jtop"><span class="kicker" id="j-step">Judge mode</span><button class="pill sm" id="j-close" aria-label="Close judge mode">Close</button></div>
  <h2 id="j-title" tabindex="-1"></h2><p id="j-text"></p>
  <div class="row"><button class="btn" id="j-prev">Previous</button><button class="btn y" id="j-next">Next</button></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
