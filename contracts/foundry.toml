[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
    "erc8183/=lib/erc8183/contracts/",
    "@openzeppelin/contracts/=lib/erc8183/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/erc8183/lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/erc8183/lib/forge-std/src/",
]
